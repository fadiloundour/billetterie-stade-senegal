<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Générer un lien d'accès · Billetterie 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#14201a,#070a08 70%);color:#F4F2EC;font-family:Manrope,system-ui,sans-serif;padding:20px}
.card{width:min(460px,100%);background:rgba(18,24,20,.85);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:26px}
h1{font-family:'Barlow Condensed',sans-serif;font-size:30px;letter-spacing:.06em;text-transform:uppercase}
p{color:rgba(244,242,236,.62);font-size:13px;line-height:1.6;margin-top:6px}
label{display:block;font-size:12px;font-weight:700;margin:18px 0 6px;color:rgba(244,242,236,.8)}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:#0d120f;color:#F4F2EC;font:inherit;font-size:14px}
button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:30px;background:#00853F;color:#fff;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
button:disabled{opacity:.5}
.out{display:none;margin-top:20px;padding:14px;border-radius:14px;background:#0d120f;border:1px solid rgba(18,179,92,.4)}
.out.on{display:block}.out code{display:block;word-break:break-all;font-size:12px;color:#12B35C;margin:8px 0}
.out .copy{margin-top:10px;background:#F4F2EC;color:#111}
.err{color:#ff8a80;font-size:13px;margin-top:12px;min-height:18px}
</style></head><body>
<div class="card">
<h1>Lien d'accès temporaire</h1>
<p>Génère un lien vers la billetterie 3D, valable pendant la durée choisie. Toute personne qui a le lien peut visiter le site jusqu'à son expiration.</p>
<label for="pw">Phrase secrète</label><input id="pw" type="password" autocomplete="current-password" placeholder="ta phrase secrète">
<label for="dur">Durée de validité</label><select id="dur"><option value="15">15 minutes</option><option value="30" selected>30 minutes</option><option value="60">1 heure</option><option value="1440">24 heures</option></select>
<button id="go">Générer le lien</button>
<div class="err" id="err"></div>
<div class="out" id="out"><b>Lien prêt</b><code id="link"></code><small id="until" style="color:rgba(244,242,236,.62)"></small><button class="copy" id="copy">Copier le lien</button></div>
</div>
<script>
var K={salt:'ZWPIgKQhcLVp3FBr8ISViA==',iv:'m2xVAquUyakoma74',enc:'N+GmLuSjkAed7qSQxnHQBkV04JTLhd7iE8bMio8GbUmS2PkjKycSv/YfnrNVnhAH3Ef7cZy5BMj510yFUS6T0/2YhMlyUhWaJa9Hk1N33rPkhVrbijdWRxjPuMyD8guXl6YaI2K51vSZwhO+RQwOsj9xG6xfmi38FsOH8tp/8apzSB/DPkbVLPm2sdtdJKanqcqAx7IdJD04kQ=='};
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function b64u(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
var key=null;
async function unlock(pass){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  var aes=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(K.salt),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var pk=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(K.iv)},aes,b64(K.enc));
  return crypto.subtle.importKey('pkcs8',pk,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);}
document.getElementById('go').onclick=async function(){var btn=this,err=document.getElementById('err');err.textContent='';btn.disabled=true;
  try{if(!key)key=await unlock(document.getElementById('pw').value.trim());}catch(e){err.textContent='Phrase secrète incorrecte.';btn.disabled=false;return;}
  var mins=+document.getElementById('dur').value,exp=Date.now()+mins*60000;
  var sig=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},key,new TextEncoder().encode('stade:'+exp));
  var url=location.href.replace(/generer\.html.*$/,'').replace(/[#?].*$/,'')+'#acces='+exp+'.'+b64u(sig);
  document.getElementById('link').textContent=url;
  document.getElementById('until').textContent='Valable jusqu\u2019à '+new Date(exp).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+' ('+mins+' min).';
  document.getElementById('out').classList.add('on');btn.disabled=false;};
document.getElementById('copy').onclick=function(){var t=document.getElementById('link').textContent,b=this;navigator.clipboard.writeText(t).then(function(){b.textContent='✓ Copié';setTimeout(function(){b.textContent='Copier le lien';},1500);});};
</script></body></html>
